name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - run: gradle assembleDebug --no-daemon --stacktrace
      # Account-wide Actions artifact quota is full + lags 6-12h; publish to a Release instead.
      - name: Publish APK to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" app/build/outputs/apk/debug/Ridge-*.apk \
            --title "RIDGE CI build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }}" \
            --target "${{ github.sha }}"
